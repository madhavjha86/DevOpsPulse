# SonarCloud Configuration for DevOpsPulse
sonar.projectKey=madhavjha86_DevOpsPulse
sonar.organization=madhavjha86

# Source directories
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests

# Exclusions from production analysis
sonar.exclusions=backend/scripts/**,frontend/dist/**,**/node_modules/**,**/__pycache__/**,backups/**,*.md,*.log
sonar.test.inclusions=backend/tests/**
sonar.coverage.exclusions=backend/scripts/**,backend/tests/**,frontend/src/**/*.test.*

# Environment configuration
sonar.javascript.environments=browser,node
sonar.sourceEncoding=UTF-8
